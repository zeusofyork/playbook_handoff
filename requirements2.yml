---
# Collections required by this project. In AAP 2.6 these come from the
# Execution Environment; locally, install with:
#   ansible-galaxy collection install -r requirements.yml --collections-path collections
collections:
  - name: azure.azcollection
    version: ">=3.0.0"
  # Provided by the AAP 2.6 default EE; from Automation Hub, not public Galaxy.
  - name: ansible.controller
